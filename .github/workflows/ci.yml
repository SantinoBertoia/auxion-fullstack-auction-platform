name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auxion_test
          POSTGRES_USER: auxion_user
          POSTGRES_PASSWORD: auxion_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auxion_user -d auxion_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://auxion_user:auxion_test_password@localhost:5432/auxion_test
      TEST_DATABASE_URL: postgresql://auxion_user:auxion_test_password@localhost:5432/auxion_test
      DATABASE_SSL: "false"
      JWT_SECRET: ci-test-secret-with-at-least-32-characters
      MAIL_TRANSPORT: console
      ALLOW_DB_RESET: "true"
      CORS_ORIGINS: http://localhost:19006,http://localhost:8081
      ENABLE_REGISTRATION_REVIEW_JOB: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Check backend syntax
        run: npm run check
        working-directory: backend

      - name: Run database migrations
        run: npm run db:migrate
        working-directory: backend

      - name: Run backend unit and integration tests
        run: npm test
        working-directory: backend

      - name: Check whitespace
        run: git diff --check

      - name: Install frontend dependencies
        run: npm ci

      - name: Export Expo Web
        run: npm run build:web
